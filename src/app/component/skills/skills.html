<section
  id="skills"
  class="min-h-screen flex items-center py-20 px-4 bg-[#222222]"
>
  <div class="max-w-6xl mx-auto w-full">

    <!-- Section Header -->
    <div class="mb-12">

      <p
        class="text-blue-400 mb-2 uppercase tracking-widest text-sm"
      >
        My expertise
      </p>

      <h2 class="text-white text-4xl">
        Skills & Technologies
      </h2>

      <div class="w-20 h-1 bg-blue-500 mt-4"></div>

    </div>


    <!-- Skills Grid -->
    <div class="grid md:grid-cols-2 gap-6">

      @for (skill of skills; track skill.name) {

        <!-- Skill Card -->
        <div
          class="bg-[#2a2a2a] p-6 rounded-xl
                 border border-slate-700
                 hover:border-blue-500
                 transition-all group"
        >

          <!-- Skill Header -->
          <div class="flex items-start gap-4 mb-4">

            <!-- Icon -->
            <div
              class="w-12 h-12 rounded-lg
                     flex items-center justify-center
                     flex-shrink-0
                     group-hover:scale-110
                     transition-transform"
              [ngClass]="skill.color.bg"
            >
              <lucide-icon
                [img]="skill.icon"
                [size]="24"
                [ngClass]="skill.color.text"
              ></lucide-icon>
            </div>


            <!-- Name + Where -->
            <div class="flex-1">

              <h3 class="text-white text-lg mb-1">
                {{ skill.name }}
              </h3>

              <p
                class="text-sm font-medium"
                [ngClass]="skill.color.text"
              >
                {{ skill.where }}
              </p>

            </div>

          </div>


          <!-- Problem / Description -->
          <div
            class="pl-16 ml-6 border-l-2"
            [ngClass]="skill.color.border"
          >
            <p
              class="text-slate-300 text-sm leading-relaxed"
            >
              {{ skill.problem }}
            </p>
          </div>

        </div>

      }

    </div>

  </div>
</section>
