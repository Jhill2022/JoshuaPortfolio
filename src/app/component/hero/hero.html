<section
  id="home"
  class="min-h-screen flex items-center justify-center px-4 bg-[#222222] relative overflow-hidden"
>
  <!-- Background image with tinted opacity -->
  <div
    class="absolute inset-0 bg-cover bg-center opacity-20"
    [style.backgroundImage]="'url(https://images.unsplash.com/photo-1522071820081-009f0129c71c?fm=jpg)'"
  ></div>

  <!-- Dark overlay tint -->
  <div
    class="absolute inset-0 bg-gradient-to-br from-[#222222]/80 via-[#2a2a2a]/80 to-[#222222]/80"
  ></div>

  <div class="max-w-4xl mx-auto text-center relative z-10">

    <div class="mb-8">

      <p class="text-blue-400 mb-4 uppercase tracking-widest text-sm">
        Welcome
      </p>

      <h1 class="mb-6 text-white text-5xl lg:text-6xl">
        I'm <span class="text-blue-400">Joshua Hill</span>
      </h1>

      <div class="flex items-center justify-center gap-3 mb-6">

        <div class="h-px w-12 bg-blue-500"></div>

        <h2 class="text-slate-300 text-xl">
          Full Stack Software Engineer
        </h2>

        <div class="h-px w-12 bg-blue-500"></div>

      </div>

      <p
        class="text-slate-400 max-w-2xl mx-auto mb-10 text-lg leading-relaxed"
      >
        I build exceptional digital experiences that combine elegant code
        with intuitive design. Passionate about creating scalable
        applications that make a difference.
      </p>

    </div>

    <!-- Buttons -->
    <div class="flex gap-4 justify-center mb-16">

      <!-- View My Work -->
      <a
        href="#projects"
        class="px-8 py-3 bg-blue-500 text-white rounded-lg
               hover:bg-blue-600 transition-all
               hover:shadow-lg hover:shadow-blue-500/50"
      >
        View My Work
      </a>

      <!-- Download CV -->
      <a
        href="/resume.pdf"
        download="Joshua-Hill-Resume.pdf"
        class="px-8 py-3 border-2 border-slate-700
               text-slate-300 rounded-lg
               hover:border-transparent hover:text-white
               transition-all hover:shadow-2xl
               hover:shadow-blue-500/50 hover:scale-105
               flex items-center gap-2 group relative overflow-hidden"
      >

        <!-- Hover background -->
        <div
          class="absolute inset-0
                 bg-gradient-to-r from-blue-600
                 via-blue-500 to-cyan-500
                 opacity-0 group-hover:opacity-100
                 transition-opacity duration-300 -z-10"
        ></div>

        <!-- Download icon -->
        <lucide-icon
          [img]="Download"
          [size]="18"
          class="relative z-10 group-hover:animate-bounce"
        ></lucide-icon>

        <span class="relative z-10 font-semibold tracking-wide">
          Download CV
        </span>

      </a>

      <!-- Get In Touch -->
      <a
        href="#contact"
        class="px-8 py-3 border-2 border-slate-700
               text-slate-300 rounded-lg
               hover:border-blue-500 hover:text-blue-400
               transition-all"
      >
        Get In Touch
      </a>

    </div>

    <!-- Scroll Down -->
    <a
      href="#about"
      class="inline-flex flex-col items-center gap-2
             text-slate-500 hover:text-blue-400
             transition-colors animate-bounce"
    >
      <span class="text-xs uppercase tracking-wider">
        Scroll Down
      </span>

      <lucide-icon
        [img]="ArrowDown"
        [size]="20"
      ></lucide-icon>
    </a>

  </div>
</section>
